<h1 class="app-maps-hidden">Mappe</h1>

<a class="app-create" [href]="editorUrl" target="_blank" rel="noopener">
  <div class="app-create__text">
    <h2 class="app-create__title">Crea la tua mappa</h2>
    <p class="app-create__desc">Colora Stati e regioni, traccia rotte, aggiungi simboli e testi, poi scarica la carta come immagine.</p>
    <span class="fc-btn fc-btn--primary app-create__btn">Apri l'editor</span>
  </div>
  <div class="app-create__preview">
    <img src="/atlante/anteprime/editor.jpg" alt="Anteprima dell'editor di mappe" decoding="async" />
  </div>
</a>

<section aria-labelledby="mappe-create">
  <h2 class="fc-section-title" id="mappe-create">Mappe già create</h2>
  <div class="fc-grid">
    @for (m of maps; track m.file) {
      <a class="fc-video app-map" [href]="openUrl(m)" target="_blank" rel="noopener">
        <div class="app-map__preview">
          <img [src]="previewUrl(m)" alt="" loading="lazy" decoding="async" />
        </div>
        <h3 class="app-map__title">{{ m.title }}</h3>
      </a>
    }
  </div>
</section>
