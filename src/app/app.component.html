<div class="fc fc-page">
  <a class="app-skip" href="#contenuto">Vai al contenuto</a>

  <header class="fc-topbar">
    <button class="fc-hamburger" type="button" aria-label="Apri menu" aria-controls="menu" [attr.aria-expanded]="drawerOpen" (click)="openDrawer()">
      <span class="fc-hamburger__lines" aria-hidden="true"><span class="fc-hamburger__line"></span><span class="fc-hamburger__line"></span><span class="fc-hamburger__line"></span></span>
    </button>
    <p class="fc-topbar__title">{{ pageTitle }}</p>
  </header>

  @if (drawerOpen) {
    <div class="fc-scrim app-scrim" (click)="closeDrawer()" aria-hidden="true"></div>
  }
  <nav id="menu" class="fc-drawer app-drawer" [class.open]="drawerOpen" aria-label="Menu" [attr.aria-hidden]="!drawerOpen" [attr.inert]="drawerOpen ? null : ''">
    <button #closeBtn class="fc-hamburger app-drawer__close" type="button" aria-label="Chiudi menu" (click)="closeDrawer()">
      <span class="fc-hamburger__lines" aria-hidden="true"><span class="fc-hamburger__line"></span><span class="fc-hamburger__line"></span><span class="fc-hamburger__line"></span></span>
    </button>
    <ul>
      <li><a routerLink="/" routerLinkActive="is-current" [routerLinkActiveOptions]="{ paths: 'exact', queryParams: 'ignored', matrixParams: 'ignored', fragment: 'ignored' }" ariaCurrentWhenActive="page" (click)="closeDrawer()">Catalogo</a></li>
      <li><a routerLink="/sources" routerLinkActive="is-current" ariaCurrentWhenActive="page" (click)="closeDrawer()">Fonti</a></li>
      <li><a routerLink="/materials" routerLinkActive="is-current" ariaCurrentWhenActive="page" (click)="closeDrawer()">Materiali utili</a></li>
    </ul>
  </nav>

  <main id="contenuto" class="fc-page__main">
    <router-outlet></router-outlet>
  </main>

  <footer class="fc-footer">
    <p class="fc-footer__text">Seguici</p>
